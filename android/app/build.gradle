apply plugin: 'com.android.application'

// Signature de publication : jamais dans le dépôt. Le trousseau et ses mots de passe
// viennent de android/keystore.properties (ignoré par git) ou des variables
// d'environnement MKAPMS_KEYSTORE_* pour une signature automatisée.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def ksPath = keystoreProps['storeFile'] ?: System.getenv("MKAPMS_KEYSTORE_FILE")
def ksPassword = keystoreProps['storePassword'] ?: System.getenv("MKAPMS_KEYSTORE_PASSWORD")
def ksAlias = keystoreProps['keyAlias'] ?: System.getenv("MKAPMS_KEY_ALIAS")
def ksKeyPassword = keystoreProps['keyPassword'] ?: System.getenv("MKAPMS_KEY_PASSWORD")
def hasSigning = ksPath != null && file(ksPath).exists()

// Trois applications, un seul projet : l'identifiant et le nom affiché viennent
// de mobile/variants.json via le script mobile/build-apps.mjs. Sans propriété
// fournie, on construit l'application grand public.
def variantAppId = project.findProperty("mkapmsAppId") ?: "com.mkapms.app"
def variantAppName = project.findProperty("mkapmsAppName") ?: "MKA.P-MS"
// App Links : une seule application capte les liens du site (voir
// mobile/variants.json). Les autres reçoivent un hôte inexistant, donc aucun lien.
def variantLinksHost = project.findProperty("mkapmsAppLinksHost") ?: "www.mkapms.fr"
def variantLinksHostAlt = project.findProperty("mkapmsAppLinksHostAlt") ?: "mkapms.fr"
def variantLinksVerify = variantLinksHost.endsWith(".invalid") ? "false" : "true"

android {
    namespace "com.mkapms.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId variantAppId
        resValue "string", "app_name", variantAppName
        resValue "string", "title_activity_main", variantAppName
        resValue "string", "package_name", variantAppId
        resValue "string", "custom_url_scheme", variantAppId
        manifestPlaceholders = [
            appLinksHost: variantLinksHost,
            appLinksHostAlt: variantLinksHostAlt,
            appLinksAutoVerify: variantLinksVerify,
        ]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
