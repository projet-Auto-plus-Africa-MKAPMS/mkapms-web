apply plugin: 'com.android.application'

// Signature de publication : jamais dans le dépôt. Le trousseau et ses mots de passe
// viennent de android/keystore.properties (ignoré par git) ou des variables
// d'environnement MKAPMS_KEYSTORE_* pour une signature automatisée.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def ksPath = keystoreProps['storeFile'] ?: System.getenv("MKAPMS_KEYSTORE_FILE")
def ksPassword = keystoreProps['storePassword'] ?: System.getenv("MKAPMS_KEYSTORE_PASSWORD")
def ksAlias = keystoreProps['keyAlias'] ?: System.getenv("MKAPMS_KEY_ALIAS")
def ksKeyPassword = keystoreProps['keyPassword'] ?: System.getenv("MKAPMS_KEY_PASSWORD")
def hasSigning = ksPath != null && file(ksPath).exists()

// Quatre applications, un seul projet : mobile/variants.json est l'unique
// source de vérité (comme pour tout autre catalogue de la plateforme). Chaque
// entrée devient un « product flavor » Gradle — mécanisme standard Android
// pour plusieurs applications à partir d'un même code natif, sans le dupliquer.
// Un flavor hérite automatiquement de src/main/ pour tout ce qu'il ne
// redéfinit pas, et peut recevoir plus tard ses propres ressources
// (src/<flavor>/res/ — icône, écran de lancement…) sans toucher aux autres :
// c'est ce mécanisme, pas une propriété en plus, qui permet à terme une
// icône, un splash, des liens et des métadonnées propres par application.
def variantsFile = rootProject.file("../mobile/variants.json")
def variants = new groovy.json.JsonSlurper().parseText(variantsFile.getText("UTF-8"))

// Version unique : celle de package.json. Le site et les trois applications
// affichent le même numéro, et versionCode en découle (major*10000 + minor*100 + patch)
// pour que chaque livraison soit acceptée par le Play Store sans saisie manuelle.
def pkgFile = rootProject.file("../package.json")
def pkgVersion = new groovy.json.JsonSlurper().parseText(pkgFile.getText("UTF-8")).version
def pkgParts = pkgVersion.tokenize(".").collect { it.toInteger() }
def pkgVersionCode = pkgParts[0] * 10000 + pkgParts[1] * 100 + pkgParts[2]

android {
    namespace "com.mkapms.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pkgVersionCode
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Un flavor par entrée de mobile/variants.json. App Links : une seule
    // application capte les liens du site (voir ce fichier) ; les autres
    // reçoivent un hôte inexistant ("*.invalid"), donc aucun lien ne leur est
    // jamais proposé.
    flavorDimensions "app"
    productFlavors {
        variants.each { key, v ->
            "$key" {
                dimension "app"
                applicationId v.appId
                resValue "string", "app_name", v.appName
                resValue "string", "title_activity_main", v.appName
                resValue "string", "package_name", v.appId
                resValue "string", "custom_url_scheme", v.appId
                manifestPlaceholders = [
                    appLinksHost: v.appLinksHost,
                    appLinksHostAlt: v.appLinksHostAlt,
                    appLinksAutoVerify: v.appLinksHost.endsWith(".invalid") ? "false" : "true",
                ]
            }
        }
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
