apply plugin: 'com.android.application'

// Signature de publication : jamais dans le dépôt. Le trousseau et ses mots de passe
// viennent de android/keystore.properties (ignoré par git) ou des variables
// d'environnement MKAPMS_KEYSTORE_* pour une signature automatisée.
//
// Play App Signing attribue une clé d'upload À CHAQUE APPLICATION (package
// name) séparément : rien n'empêche qu'une seule des cinq applications (ex.
// com.mkapms.command, après une réinitialisation de clé d'upload demandée
// via la Play Console) ait besoin d'un trousseau différent des quatre
// autres, qui continuent d'utiliser le trousseau partagé. Chaque variante a
// donc SA PROPRE signingConfig ci-dessous : les variables
// MKAPMS_KEYSTORE_FILE_<FLAVOR> (ex. MKAPMS_KEYSTORE_FILE_COMMAND, en
// majuscules) redirigent une variante précise vers un trousseau dédié ;
// sans elles, chaque variante retombe sur le trousseau partagé ci-dessous
// (comportement inchangé pour les applications qui n'ont jamais eu besoin
// d'un trousseau distinct).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def sharedKsPath = keystoreProps['storeFile'] ?: System.getenv("MKAPMS_KEYSTORE_FILE")
def sharedKsPassword = keystoreProps['storePassword'] ?: System.getenv("MKAPMS_KEYSTORE_PASSWORD")
def sharedKsAlias = keystoreProps['keyAlias'] ?: System.getenv("MKAPMS_KEY_ALIAS")
def sharedKsKeyPassword = keystoreProps['keyPassword'] ?: System.getenv("MKAPMS_KEY_PASSWORD")

def signingForFlavor = { flavorKey ->
    // "Locale.ROOT" plutôt que toUpperCase() sans argument : sur une JVM
    // configurée en turc, "investor".toUpperCase() (langue par défaut turque)
    // produit "İNVESTOR" (I pointé), pas "INVESTOR" — la variable dédiée
    // documentée (MKAPMS_KEY_FILE_INVESTOR) ne serait alors jamais trouvée.
    def upper = flavorKey.toUpperCase(Locale.ROOT)
    def dedicatedPath = System.getenv("MKAPMS_KEYSTORE_FILE_${upper}")
    // Le chemin, l'alias et les deux mots de passe dédiés forment UN SEUL
    // ensemble cohérent : soit les quatre viennent du trousseau dédié, soit
    // les quatre viennent du trousseau partagé — jamais un mélange (qui
    // ferait, par ex., échouer la signature avec le mot de passe dédié sur
    // le fichier partagé). Un chemin dédié déclaré mais introuvable (secret
    // mal encodé, fichier déplacé) retombe donc intégralement sur le
    // trousseau partagé, au lieu de laisser la variante non signée alors
    // qu'un trousseau partagé valide existe.
    def useDedicated = dedicatedPath != null && file(dedicatedPath).exists()
    def ksPath = useDedicated ? dedicatedPath : sharedKsPath
    [
        path: ksPath,
        password: useDedicated ? System.getenv("MKAPMS_KEYSTORE_PASSWORD_${upper}") : sharedKsPassword,
        alias: useDedicated ? System.getenv("MKAPMS_KEY_ALIAS_${upper}") : sharedKsAlias,
        keyPassword: useDedicated ? System.getenv("MKAPMS_KEY_PASSWORD_${upper}") : sharedKsKeyPassword,
        hasSigning: ksPath != null && file(ksPath).exists(),
    ]
}

// Cinq applications, un seul projet : mobile/variants.json est l'unique
// source de vérité (comme pour tout autre catalogue de la plateforme). Chaque
// entrée devient un « product flavor » Gradle — mécanisme standard Android
// pour plusieurs applications à partir d'un même code natif, sans le dupliquer.
// Un flavor hérite automatiquement de src/main/ pour tout ce qu'il ne
// redéfinit pas, et peut recevoir plus tard ses propres ressources
// (src/<flavor>/res/ — icône, écran de lancement…) sans toucher aux autres :
// c'est ce mécanisme, pas une propriété en plus, qui permet à terme une
// icône, un splash, des liens et des métadonnées propres par application.
def variantsFile = rootProject.file("../mobile/variants.json")
def variants = new groovy.json.JsonSlurper().parseText(variantsFile.getText("UTF-8"))

// Version unique : celle de package.json. Le site et les trois applications
// affichent le même numéro, et versionCode en découle (major*10000 + minor*100 + patch)
// pour que chaque livraison soit acceptée par le Play Store sans saisie manuelle.
def pkgFile = rootProject.file("../package.json")
def pkgVersion = new groovy.json.JsonSlurper().parseText(pkgFile.getText("UTF-8")).version
def pkgParts = pkgVersion.tokenize(".").collect { it.toInteger() }
def pkgVersionCode = pkgParts[0] * 10000 + pkgParts[1] * 100 + pkgParts[2]

android {
    namespace "com.mkapms.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pkgVersionCode
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Un flavor par entrée de mobile/variants.json. App Links : une seule
    // application capte les liens du site (voir ce fichier) ; les autres
    // reçoivent un hôte inexistant ("*.invalid"), donc aucun lien ne leur est
    // jamais proposé.
    flavorDimensions "app"
    signingConfigs {
        variants.each { key, v ->
            def sign = signingForFlavor(key)
            if (sign.hasSigning) {
                "$key" {
                    storeFile file(sign.path)
                    storePassword sign.password
                    keyAlias sign.alias
                    keyPassword sign.keyPassword
                }
            }
        }
    }
    productFlavors {
        variants.each { key, v ->
            "$key" {
                dimension "app"
                applicationId v.appId
                resValue "string", "app_name", v.appName
                resValue "string", "title_activity_main", v.appName
                resValue "string", "package_name", v.appId
                resValue "string", "custom_url_scheme", v.appId
                manifestPlaceholders = [
                    appLinksHost: v.appLinksHost,
                    appLinksHostAlt: v.appLinksHostAlt,
                    appLinksAutoVerify: v.appLinksHost.endsWith(".invalid") ? "false" : "true",
                ]
                def flavorSigningConfig = signingConfigs.findByName(key)
                if (flavorSigningConfig != null) {
                    signingConfig flavorSigningConfig
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
