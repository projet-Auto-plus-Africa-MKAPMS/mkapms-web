name: Android — App Bundles (5 applications)

# Construit les Android App Bundles (.aab) des 5 applications MKA.P-MS
# déclarées dans mobile/variants.json (grandpublic/com.mkapms.app,
# pro/com.mkapms.pro, command/com.mkapms.command,
# intelligence/com.mkapms.intelligence, investor/com.mkapms.investor).
# Distinctes des anciennes applications Play Console (com.mkapms.direction,
# com.mkapms.particulier, com.mkapms.Pro), jamais touchées ici.
#
# Déclenchement manuel uniquement : ce workflow ne publie rien sur le Play
# Store et ne déploie rien — il produit les .aab en artefacts téléchargeables.
#
# Signature release : si les secrets MKAPMS_KEYSTORE_BASE64 /
# MKAPMS_KEYSTORE_PASSWORD / MKAPMS_KEY_ALIAS / MKAPMS_KEY_PASSWORD sont
# configurés (Settings → Secrets and variables → Actions), le trousseau est
# restauré en mémoire pour ce run puis supprimé — jamais commité, jamais
# affiché dans les logs. Sans ces secrets, mobile/build-apps.mjs produit
# quand même les .aab, mais NON signés : le résumé du run le dit
# explicitement, jamais présenté comme prêt pour le Play Store.
#
# Aucun trousseau n'est généré ici. Une application qui n'a jamais reçu de
# version signée n'a pas encore de clé d'upload Play App Signing : la créer
# est une décision humaine distincte (Direction / propriétaire du compte
# Play Console), jamais improvisée par ce workflow.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variante seule à construire (grandpublic, pro, command, intelligence, investor) — vide = les 5"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dépendances npm
        run: npm ci

      - name: Vérifier les 5 applicationId (jamais les anciennes entrées Play Console)
        run: npm run check:android-appids

      - name: JDK 17 (exigé par Android Gradle Plugin 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: SDK Android
        uses: android-actions/setup-android@v4

      - name: Composants SDK requis (compileSdk/targetSdk 36)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}

      - name: Restaurer le trousseau de signature (si le secret existe)
        if: ${{ secrets.MKAPMS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.MKAPMS_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/mkapms-release.keystore"
          echo "MKAPMS_KEYSTORE_FILE=$RUNNER_TEMP/mkapms-release.keystore" >> "$GITHUB_ENV"

      - name: Construire les Android App Bundles
        env:
          MKAPMS_KEYSTORE_PASSWORD: ${{ secrets.MKAPMS_KEYSTORE_PASSWORD }}
          MKAPMS_KEY_ALIAS: ${{ secrets.MKAPMS_KEY_ALIAS }}
          MKAPMS_KEY_PASSWORD: ${{ secrets.MKAPMS_KEY_PASSWORD }}
        run: npm run mobile:build -- ${{ inputs.variant }}

      - name: Supprimer le trousseau restauré
        if: always()
        run: rm -f "$RUNNER_TEMP/mkapms-release.keystore"

      - name: Publier les .aab en artefact
        uses: actions/upload-artifact@v4
        with:
          name: mkapms-android-bundles
          path: mobile/dist/*.aab
          if-no-files-found: error
          retention-days: 14
