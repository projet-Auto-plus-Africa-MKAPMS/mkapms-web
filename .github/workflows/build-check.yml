name: Build (comme Railway)

# Empêche la panne du 19/09 de se reproduire en silence : la PR #388 a été
# mergée avec deux inventaires générés périmés (server/data/cliquables.ts,
# server/data/moteurs.ts) — `npm run build`, la commande exacte que
# railway.json fait exécuter, échouait dès lors avant même d'atteindre
# build:client/build:server. Railway a gardé silencieusement l'ancien
# déploiement (comportement normal d'un build en échec) : personne n'a été
# averti pendant 18h, parce qu'aucune vérification ne tournait avant le merge.
#
# Ce workflow exécute exactement `npm run build` sur chaque push vers main et
# chaque pull request : un échec devient un ❌ visible sur le commit/la PR,
# avant que Railway ne soit même sollicité.
#
# Pour qu'un ❌ ici bloque réellement la fusion d'une PR (pas seulement
# l'affiche), un propriétaire du dépôt doit l'ajouter comme "required status
# check" dans Settings → Branches — cet ajout dépasse les droits disponibles
# depuis cette session.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dépendances npm
        run: npm ci

      - name: Contrats TypeScript complets
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build complet (identique à railway.json)
        run: npm run build

  shop-knowledge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: core_ai_test
          POSTGRES_USER: core_ai_test
          POSTGRES_PASSWORD: disposable_ci_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U core_ai_test -d core_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node --import tsx --test server/__tests__/auth-google.test.ts
      - run: node --import tsx --test server/intelligences/__tests__/shop-knowledge.test.ts server/intelligences/__tests__/shop-knowledge.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test
      - name: SHOP isolated inference authentication and persistent quota
        run: node --import tsx --test server/intelligences/__tests__/shop-analysis.test.ts server/intelligences/__tests__/shop-analysis.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Automotive memory (reference, NHTSA sync, search tool)
        run: node --import tsx --test server/intelligences/__tests__/memoire-automobile.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Centre Cyber-Électrique memory (permanent rules, declined scope, project, lessons)
        run: node --import tsx --test server/intelligences/__tests__/souvenirs-centre-cyber-electrique.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Private image and speech productions
        run: node --import tsx --test server/intelligences/__tests__/media-productions.test.ts server/intelligences/__tests__/media-productions.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Persistent MAIN memory foundations
        run: node --import tsx --test server/intelligences/__tests__/memory-foundations.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Developer agent orchestration (mission recognition, proofs, memory without duplicates)
        run: node --import tsx --test server/intelligences/__tests__/orchestration-reglages.test.ts server/intelligences/__tests__/orchestration-memoire.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Historical delivery journal (memory enrichment, idempotent seed)
        run: node --import tsx --test server/intelligences/__tests__/livraisons-historique.test.ts server/intelligences/__tests__/livraisons-historique.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: SHOP access (vault name tolerance, token diagnostics)
        run: node --import tsx --test server/intelligences/__tests__/boutique.test.ts server/intelligences/__tests__/coffre-boutique.integration.test.ts client/src/lib/__tests__/connecteurs.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Shop link engine (cable, signed messages, exchange box, PDG router)
        run: node --import tsx --test server/shop-link/__tests__/contrats.test.ts server/shop-link/__tests__/shop-link.integration.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Frontier OS cyber-electric center (inventory, independent database, chain, cuts, transport, faults, workshop, governance, PDG router, separation, backup, real links, autonomy, development gaps)
        # Un fichier par commande : tous partagent la même base jetable (le schéma « frontier » y est recréé), ils ne peuvent pas tourner en parallèle.
        run: |
          node --import tsx --test server/frontier-os/__tests__/regles.test.ts server/frontier-os/__tests__/inventaire.test.ts
          node --import tsx --test server/frontier-os/__tests__/base.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/fondation.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/moteurs-declares.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/declares.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/chaine.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/transport.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/pannes.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/protocole.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/atelier.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/gouvernance.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/routeur.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/sauvegarde.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/reel.integration.test.ts
          node --import tsx --test server/frontier-os/__tests__/autonomie.test.ts
          node --import tsx --test server/frontier-os/__tests__/developpement.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test

      - name: Work mode output budget (reasoning exhausts max tokens)
        run: node --import tsx --test server/intelligences/__tests__/budget-relance.test.ts server/intelligences/__tests__/conversation-continue-travail.test.ts

      - name: Semantic memory (embeddings, simulated provider)
        run: node --import tsx --test server/intelligences/__tests__/empreintes.integration.test.ts server/intelligences/__tests__/sonde-openai.test.ts
        env:
          SHOP_KNOWLEDGE_TEST_DB: postgresql://core_ai_test:disposable_ci_fixture@localhost:5432/core_ai_test
