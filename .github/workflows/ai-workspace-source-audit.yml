name: AI workspace source audit
on:
  push:
    branches: [ai/main-workspace-recovery-20260928]
    paths: [.github/workflows/ai-workspace-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Package tracked application code only
        shell: bash
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          python3 - <<'PY'
          import subprocess, tarfile, pathlib
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          extensions={'.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.css','.html','.yml','.yaml','.sql','.md','.toml','.xml','.txt','.py','.sh','.svg'}
          with tarfile.open('source-audit.tar.gz','w:gz') as out:
            for p in paths:
              f=pathlib.Path(p)
              if not p or not f.is_file() or f.is_symlink(): continue
              if f.name.startswith('.env') or f.stat().st_size>3000000: continue
              if f.suffix not in extensions and f.name not in {'Dockerfile','.gitignore'}: continue
              if any(x in f.parts for x in ['node_modules','dist','build']): continue
              out.add(p,recursive=False)
            out.add('SOURCE_SHA.txt')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: main-source-audit-code
          path: source-audit.tar.gz
          retention-days: 1
