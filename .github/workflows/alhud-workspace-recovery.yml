name: AL-HUDHUD MAIN recovery verification
on:
  push:
    branches: [ai/main-workspace-recovery-20260928]
    paths: [scripts/apply-alhud-recovery.py, scripts/test-alhud-browser.mjs, .github/workflows/alhud-workspace-recovery.yml, client/**]
permissions:
  contents: write
concurrency:
  group: alhud-main-recovery
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/ai/main-workspace-recovery-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - name: Apply guarded recovery and refresh existing inventories
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          python3 scripts/apply-alhud-recovery.py
          npm run gen:routes
          npm run gen:boutons
          npm run gen:cliquables
          npm run gen:sections
          npm run gen:moteurs
          git add -u
          if ! git diff --cached --quiet; then
            test "$(git ls-remote origin refs/heads/ai/main-workspace-recovery-20260928 | cut -f1)" = "$BEFORE"
            git config user.name 'MKA.P-MS workspace recovery'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(ai): one MAIN sidebar and isolated conversation drafts and request lifecycles'
            git push origin HEAD:refs/heads/ai/main-workspace-recovery-20260928
          fi
          git rev-parse HEAD > alhud-tested-sha.txt
          git config --local --unset-all http.https://github.com/.extraheader || true
      - run: npm run typecheck
        env: {NODE_OPTIONS: --max-old-space-size=6144}
      - run: npm run build
        env: {NODE_OPTIONS: --max-old-space-size=6144}
      - run: node scripts/test-alhud-workspace.mjs
      - name: Install browser tooling without changing lockfile
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Real UI with synthetic private APIs
        run: node scripts/test-alhud-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alhud-main-recovery-evidence
          path: |
            alhud-tested-sha.txt
            test-results/alhud-*.png
            test-results/alhud-main-browser.json
          retention-days: 7
