name: AL-HUDHUD regeneration draft verification
on:
  push:
    branches: [ai/main-regenerate-draft-20260928]
    paths: [scripts/fix-regeneration-drafts.py, scripts/test-alhud-browser.mjs, .github/workflows/alhud-regeneration-drafts.yml, client/**]
permissions:
  contents: write
concurrency:
  group: alhud-main-regeneration-drafts
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/ai/main-regenerate-draft-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply correction only on its dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          python3 scripts/fix-regeneration-drafts.py
          git add client/src/pages/intelligence/modules/Conversation.tsx scripts/test-alhud-browser.mjs
          if ! git diff --cached --quiet; then
            test "$(git ls-remote origin refs/heads/ai/main-regenerate-draft-20260928 | cut -f1)" = "$BEFORE"
            git config user.name 'MKA.P-MS workspace recovery'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(ai): preserve composed drafts during successful or failed regeneration'
            git push origin HEAD:refs/heads/ai/main-regenerate-draft-20260928
          fi
          git rev-parse HEAD > alhud-tested-sha.txt
          git config --local --unset-all http.https://github.com/.extraheader || true
      - run: npm ci
      - run: npm run typecheck
        env: {NODE_OPTIONS: --max-old-space-size=6144}
      - run: npm run build
        env: {NODE_OPTIONS: --max-old-space-size=6144}
      - run: node scripts/test-alhud-workspace.mjs
      - name: Browser tooling; no lockfile or production configuration change
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Existing UI acceptance plus regeneration success/failure and draft ownership
        run: node scripts/test-alhud-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alhud-main-regeneration-evidence
          path: |
            alhud-tested-sha.txt
            test-results/alhud-*.png
            test-results/alhud-main-browser.json
          retention-days: 7
